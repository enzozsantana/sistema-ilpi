<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sistema ILPI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF2F0;--surface:#FFFFFF;--ink:#18231F;--muted:#5B6B65;--line:#D5DED9;
  --brand:#1F5E52;--brand-ink:#FFFFFF;--brand-soft:#DCEBE5;
  --warn:#8A5700;--warn-soft:#FBEFD6;--danger:#B42318;--danger-soft:#FBE3E0;
  --ok:#2E7D4F;--ok-soft:#DDF0E3;--accent:#4B3FA0;--accent-soft:#E6E3F6;
  color-scheme:light;box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#101715;--surface:#18211E;--ink:#E6EEEA;--muted:#9AABA4;--line:#2A3632;
  --brand:#6CC2AE;--brand-ink:#0E1A17;--brand-soft:#1C3530;
  --warn:#E9B44C;--warn-soft:#3A2E14;--danger:#F2877C;--danger-soft:#3D1E1B;
  --ok:#7FD39C;--ok-soft:#1B3324;--accent:#A99CF5;--accent-soft:#2A2645;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101715;--surface:#18211E;--ink:#E6EEEA;--muted:#9AABA4;--line:#2A3632;
  --brand:#6CC2AE;--brand-ink:#0E1A17;--brand-soft:#1C3530;
  --warn:#E9B44C;--warn-soft:#3A2E14;--danger:#F2877C;--danger-soft:#3D1E1B;
  --ok:#7FD39C;--ok-soft:#1B3324;--accent:#A99CF5;--accent-soft:#2A2645;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.5}
h1,h2,h3{font-family:"Bricolage Grotesque","Atkinson Hyperlegible",system-ui,sans-serif;line-height:1.15;margin:0;font-weight:700}
h1{font-size:clamp(1.6rem,4.5vw,2.4rem);letter-spacing:-.02em}
h2{font-size:1.2rem}
h3{font-size:1rem;margin-top:14px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.muted{color:var(--muted)}
.small{font-size:.85rem}
.hint{color:var(--muted);font-size:.9rem;margin:.25rem 0 1rem}

.app{display:grid;grid-template-columns:228px minmax(0,1fr);min-height:100%}
nav.side{position:sticky;top:env(safe-area-inset-top,0px);align-self:start;height:100vh;padding:24px 14px;display:flex;flex-direction:column;gap:4px;border-right:1px solid var(--line);background:var(--surface)}
.brand{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:700;font-size:1.25rem;padding:0 10px 18px;color:var(--brand)}
.brand small{display:block;font-family:"Atkinson Hyperlegible",system-ui,sans-serif;font-weight:400;font-size:.8rem;color:var(--muted)}
.navbtn{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;border:0;background:none;text-align:left;cursor:pointer;color:var(--muted);position:relative}
.navbtn svg{width:20px;height:20px;flex:none}
.navbtn:hover{background:var(--bg);color:var(--ink)}
.navbtn[aria-current="page"]{background:var(--brand-soft);color:var(--brand);font-weight:700}
.navbtn .pip{position:absolute;top:8px;left:26px;width:8px;height:8px;border-radius:50%;background:var(--danger)}
main{padding:20px 36px 56px;max-width:1080px;width:100%}
.whobar{display:flex;justify-content:flex-end;align-items:center;gap:8px;margin-bottom:14px;font-size:.85rem;color:var(--muted);flex-wrap:wrap}
.whobar select{width:auto;max-width:100%;padding:6px 10px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;margin-top:18px}
.card-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:10px;cursor:pointer;font-weight:700;font-size:.92rem;text-decoration:none;display:inline-block}
.btn:hover{border-color:var(--brand)}
.btn.primary{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.btn.ghost{border-color:transparent;background:none;color:var(--brand);padding:6px 8px}
.btn.danger{color:var(--danger)}
.btn.sm{padding:5px 10px;font-size:.85rem}
input[type=text],input[type=number],input[type=date],input[type=time],input[type=tel],select,textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
textarea{min-height:84px;resize:vertical}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.85rem;color:var(--muted)}
label.f>*{color:var(--ink);font-size:1rem}
.form{display:grid;gap:12px}
.fields{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:12px}
.fields.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.badge{display:inline-block;font-size:.78rem;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--bg);color:var(--muted);white-space:nowrap}
.badge.danger{background:var(--danger-soft);color:var(--danger)}
.badge.warn{background:var(--warn-soft);color:var(--warn)}
.badge.ok{background:var(--ok-soft);color:var(--ok)}
.badge.accent{background:var(--accent-soft);color:var(--accent)}
.list{display:flex;flex-direction:column}
.li{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.li:first-child{border-top:0}
.li .main{min-width:0;flex:1 1 220px}
.li .sub{color:var(--muted);font-size:.88rem}
.stamp{display:inline-block;margin-top:6px;font-size:.76rem;color:var(--accent);border:1px solid var(--accent);border-radius:6px;padding:2px 8px;line-height:1.35}
.lock{font-size:.85rem;color:var(--muted);padding:10px 12px;border-radius:10px;background:var(--bg);margin-top:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:5px 12px;cursor:pointer;font-size:.88rem}
.chip[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}

/* Plantão */
.today-date{color:var(--muted);margin:0 0 6px}
.shift{display:inline-flex;align-items:center;gap:8px;margin-top:10px;font-size:.95rem}
.alerts{display:flex;flex-direction:column;gap:8px;margin-top:18px}
.alert{display:grid;grid-template-columns:6px 1fr auto;gap:0 14px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px 12px 0;cursor:pointer;overflow:hidden}
.alert::before{content:"";grid-row:1/3;align-self:stretch;margin:-12px 0}
.alert.danger::before{background:var(--danger)}
.alert.warn::before{background:var(--warn)}
.alert span{grid-column:2;color:var(--muted);font-size:.88rem}
.alert .go{grid-column:3;grid-row:1/3;color:var(--brand);font-size:.85rem;font-weight:700;font-style:normal}
.allgood{padding:16px;border-radius:12px;background:var(--ok-soft);color:var(--ok);font-weight:700;margin-top:18px}
.ronda{display:flex;flex-direction:column}
.slot{display:grid;grid-template-columns:64px minmax(0,1fr);gap:12px;padding:12px 0;border-top:1px dashed var(--line)}
.slot:first-child{border-top:0}
.slot .hora{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:700;font-size:1.15rem;color:var(--brand)}
.slot.past .hora{color:var(--muted)}
.doses{display:flex;flex-wrap:wrap;gap:8px}
.dose{display:flex;flex-direction:column;align-items:flex-start;gap:1px;padding:8px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);cursor:pointer;text-align:left;min-width:160px;max-width:100%}
.dose .who{font-weight:700}
.dose .what{font-size:.85rem;color:var(--muted)}
.dose .by{font-size:.75rem;font-weight:700}
.dose.dado{background:var(--ok-soft);border-color:transparent}.dose.dado .by{color:var(--ok)}
.dose.recusado,.dose.nao{background:var(--warn-soft);border-color:transparent}.dose.recusado .by,.dose.nao .by{color:var(--warn)}
.dose.late{border-color:var(--danger);background:var(--danger-soft)}
.dose.late .what::after{content:" (atrasada)";color:var(--danger);font-weight:700}
.rescare{border-top:1px solid var(--line);padding:12px 0}
.rescare:first-child{border-top:0}
.check{display:flex;align-items:center;gap:10px;padding:9px 12px;border:1px solid var(--line);border-radius:10px;cursor:pointer;background:var(--bg);text-align:left;width:100%;margin-top:6px}
.check .box{width:22px;height:22px;border-radius:6px;border:2px solid var(--line);display:grid;place-items:center;flex:none;font-weight:700;color:var(--brand-ink)}
.check[aria-pressed="true"] .box{background:var(--ok);border-color:var(--ok)}
.check .by{margin-left:auto;font-size:.75rem;color:var(--ok);font-weight:700;white-space:nowrap}
.checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:6px}

/* Residentes */
.res-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;margin-top:18px}
.res{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:6px}
.res:hover{border-color:var(--brand)}
.res .q{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-size:1.9rem;font-weight:700;color:var(--brand);line-height:1}
.res.obito{opacity:.6}
.back{border:0;background:none;color:var(--brand);font-weight:700;cursor:pointer;padding:0;margin-bottom:10px}
.allergy{display:inline-block;padding:3px 10px;border-radius:8px;font-weight:700;font-size:.85rem}
.allergy.nega{background:var(--ok-soft);color:var(--ok)}
.allergy.tem{background:var(--danger-soft);color:var(--danger)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:4px 0 6px;margin-top:16px;scrollbar-width:thin}
.tab{white-space:nowrap;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;cursor:pointer;font-size:.9rem}
.tab[aria-current="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:700}
.need{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:10px;background:var(--bg)}
.need p{margin:4px 0;font-size:.9rem}
.opt{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border:1px solid var(--line);border-radius:10px;margin-top:6px;cursor:pointer;font-size:.92rem}
.opt input{margin-top:4px;flex:none}
.opt:has(input:checked){border-color:var(--brand);background:var(--brand-soft)}
.opt .pts{margin-left:auto;font-weight:700;color:var(--muted)}
.scale-total{position:sticky;bottom:-22px;background:var(--surface);padding:12px 0;border-top:1px solid var(--line);margin-top:14px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.vit{display:inline-block;margin:2px 4px 2px 0;padding:2px 8px;border-radius:6px;background:var(--bg);font-size:.82rem;white-space:nowrap}
.vit.alt{background:var(--danger-soft);color:var(--danger);font-weight:700}
.anot{border-top:1px solid var(--line);padding:12px 0}
.anot:first-child{border-top:0}
.anot p{margin:6px 0 0}

/* Tabelas */
.tablewrap{overflow-x:auto;margin-top:10px;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:.86rem}
th,td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top}
th{color:var(--muted);font-weight:700;white-space:nowrap}
.grid-t th:first-child,.grid-t td:first-child{position:sticky;left:0;background:var(--surface);z-index:1;min-width:150px;max-width:220px}
.grid-t td{white-space:nowrap}
.today-col{background:var(--brand-soft)!important}
.ms{display:block;padding:1px 6px;border-radius:5px;margin:1px 0;font-size:.76rem;font-weight:700}
.ms.dado{background:var(--ok-soft);color:var(--ok)}
.ms.recusado,.ms.nao{background:var(--warn-soft);color:var(--warn)}
.ms.late{background:var(--danger-soft);color:var(--danger)}
.ms.fut{color:var(--muted);font-weight:400}
.code{display:inline-grid;place-items:center;width:30px;height:28px;border-radius:6px;font-size:.74rem;font-weight:700;border:1px solid transparent;cursor:pointer;background:var(--bg);color:var(--muted);padding:0}
.c-D{background:#F6E7A8;color:#5A4500}.c-N{background:#DCD6F7;color:#3A2E8A}.c-M{background:#CFE4F7;color:#164C7E}
.c-T{background:#F9D9BF;color:#7A3A0A}.c-F{background:#E3E7E5;color:#4A5551}.c-FE{background:#C7E8F2;color:#0B5566}
.c-L{background:#F6C9C9;color:#8A1C1C}.c-H{background:#F3CDE6;color:#7A1C5C}.c-EX{background:#FFD8A8;color:#7A4A00}
.brushbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:10px}
.brushbar .code{width:auto;padding:0 10px}
.brushbar .code[aria-pressed="true"]{outline:3px solid var(--ink);outline-offset:1px}
.chart{width:100%;height:auto;margin-top:10px}
.big{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-size:2.6rem;font-weight:700;line-height:1}
.big.out{color:var(--danger)}

/* Modal e aviso */
.overlay{position:fixed;inset:0;background:rgba(10,20,17,.5);display:none;align-items:flex-end;justify-content:center;z-index:50;padding:12px}
.overlay.open{display:flex}
.modal{background:var(--surface);border-radius:18px;width:min(620px,100%);max-height:88vh;overflow:auto;padding:22px;margin-bottom:env(safe-area-inset-bottom,0px)}
@media(min-width:821px){.overlay{align-items:center}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:700;opacity:0;pointer-events:none;transition:opacity .2s;z-index:60;max-width:90vw;text-align:center}
.toast.show{opacity:1}
.err{color:var(--danger);font-weight:700;font-size:.9rem}

.avatar{width:56px;height:56px;border-radius:50%;flex:none;display:grid;place-items:center;font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:700;font-size:1.15rem;background:var(--brand-soft);color:var(--brand);overflow:hidden}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.avatar.sm{width:34px;height:34px;font-size:.78rem}
.avatar.lg{width:120px;height:120px;border-radius:22px;font-size:2.4rem}
.res-list{gap:26px 16px}
.folder{position:relative;margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:3px 14px 14px 14px;padding:16px;text-align:left;cursor:pointer;display:flex;gap:14px;align-items:flex-start;width:100%}
.folder::before{content:attr(data-tab);position:absolute;top:-19px;left:-1px;height:19px;padding:0 14px;border:1px solid var(--line);border-bottom:0;border-radius:9px 9px 0 0;background:var(--surface);font-size:.72rem;font-weight:700;color:var(--muted);line-height:19px}
.folder:hover,.folder:hover::before{border-color:var(--brand)}
.folder.obito{opacity:.6}
.folder .info{display:flex;flex-direction:column;gap:5px;min-width:0}
.pasta-head{display:flex;gap:18px;align-items:flex-start;flex-wrap:wrap;margin-top:4px}
.pasta-head .info{flex:1 1 240px;min-width:0}
.photo-btn{position:relative;border:0;padding:0;background:none;cursor:pointer;border-radius:22px}
.photo-btn .cam{position:absolute;left:50%;transform:translateX(-50%);bottom:-10px;background:var(--brand);color:var(--brand-ink);border-radius:999px;font-size:.72rem;padding:3px 10px;font-weight:700;white-space:nowrap}
.sumgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;margin-top:18px}
.sumgrid .card{margin-top:0}
.kv{display:grid;grid-template-columns:auto 1fr;gap:5px 14px;font-size:.92rem;margin:10px 0 0}
.kv dt{color:var(--muted)}.kv dd{margin:0}
.files{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:12px}
.file{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--bg);text-align:left;cursor:pointer;padding:0;display:flex;flex-direction:column}
.file:hover{border-color:var(--brand)}
.file .thumb{height:110px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font-weight:700;overflow:hidden}
.file .thumb img{width:100%;height:100%;object-fit:cover}
.file .meta{padding:8px 10px;font-size:.82rem;display:flex;flex-direction:column;gap:2px}
.sec-title{margin-top:28px;padding-top:12px;border-top:2px solid var(--ink)}
@media print{nav.side,.whobar,.tabs,.back,.btn,.toast,.overlay,.photo-btn .cam{display:none!important}.app{display:block}main{padding:0;max-width:none}.card{break-inside:avoid}body{background:#fff}}

@media(max-width:820px){
  .sumgrid{grid-template-columns:1fr}
  .avatar.lg{width:96px;height:96px;font-size:2rem}
  .app{grid-template-columns:1fr}
  nav.side{position:fixed;left:0;right:0;bottom:0;top:auto;height:auto;flex-direction:row;justify-content:space-around;padding:6px 2px;padding-bottom:calc(6px + env(safe-area-inset-bottom,0px));border-right:0;border-top:1px solid var(--line);z-index:30;gap:0}
  .brand{display:none}
  .navbtn{flex-direction:column;gap:2px;font-size:.66rem;padding:6px 2px;flex:1;align-items:center;text-align:center}
  .navbtn .pip{left:calc(50% + 6px);top:4px}
  main{padding:14px 14px 120px}
  .grid2,.fields,.fields.two{grid-template-columns:1fr}
  .slot{grid-template-columns:52px minmax(0,1fr)}
  .dose{min-width:0;flex:1 1 150px}
  .card{padding:16px}
  .whobar{justify-content:flex-start}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <nav class="side" id="nav" aria-label="Seções"></nav>
  <main id="main"></main>
</div>
<div class="overlay" id="overlay"><div class="modal" id="modal" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" role="status"></div>
<script>
/* ================= utilidades ================= */
const KEY='sistema-ilpi-v3';
const pad=n=>String(n).padStart(2,'0');
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const addD=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const parse=s=>{const [y,m,d]=String(s).slice(0,10).split('-').map(Number);return new Date(y,(m||1)-1,d||1)};
const diffDays=(a,b)=>Math.round((parse(a)-parse(b))/864e5);
const fmt=s=>{if(!s)return'–';const d=parse(s);return `${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()}`};
const fmtDM=s=>{const d=typeof s==='string'?parse(s):s;return `${pad(d.getDate())}/${pad(d.getMonth()+1)}`};
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num=v=>String(Math.round(v*10)/10).replace('.',',');
const toNum=v=>{const n=parseFloat(String(v??'').replace(',','.'));return isNaN(n)?null:n};
const TODAY=new Date();const T=iso(TODAY);
const mesKey=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}`;
const MK=mesKey(TODAY);
const diasNoMes=mk=>{const [y,m]=mk.split('-').map(Number);return new Date(y,m,0).getDate()};
const MESES=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const DIAS=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
const agoraHM=()=>{const n=new Date();return `${pad(n.getHours())}:${pad(n.getMinutes())}`};
const minDe=h=>{const [a,b]=String(h).split(':').map(Number);return a*60+(b||0)};
const minAgora=()=>{const n=new Date();return n.getHours()*60+n.getMinutes()};
const primeiro=n=>String(n||'').replace(/^(Dra?\.)\s+/,'').split(' ')[0];
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const idade=nasc=>{if(!nasc)return'–';const n=parse(nasc);let a=TODAY.getFullYear()-n.getFullYear();if(TODAY<new Date(TODAY.getFullYear(),n.getMonth(),n.getDate()))a--;return a};
const getPath=(o,p)=>p.split('.').reduce((x,k)=>x==null?x:x[k],o);

let S;
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){S=null}

/* ================= regras ================= */
const prof=id=>S.equipe.find(p=>p.id===id)||{nome:'Profissional removido',conselho:'',cat:'apoio'};
const me=()=>prof(S.user);
const can=k=>CAN[k].includes(me().cat);
const pode=(mapa,k)=>mapa[k]==='*'||(mapa[k]||[]).includes(me().cat);
const escalasVisiveis=()=>Object.keys(SCALES).filter(k=>me().cat!=='multi'||(ESCALA_AREA[k]||[]).includes(me().area));
const canAval=k=>['rt','enf'].includes(me().cat)||(me().cat==='multi'&&(ESCALA_AREA[k]||[]).includes(me().area));
const iniciais=n=>String(n||'').replace(/^(Dra?\.)\s+/,'').split(/\s+/).filter(Boolean).map(x=>x[0]).filter((x,i,a)=>i===0||i===a.length-1).join('').toUpperCase();
const avatar=(r,cls='')=>r.foto?`<span class="avatar ${cls}"><img src="${esc(r.foto)}" alt="Foto de ${esc(r.nome)}"></span>`:`<span class="avatar ${cls}" aria-hidden="true">${esc(iniciais(r.nome))}</span>`;
const res=id=>S.residentes.find(r=>r.id===id);
const ativos=()=>S.residentes.filter(r=>r.status!=='obito');
const assinar=()=>({id:S.user,d:T,h:agoraHM()});
function stamp(sig,pre='Assinado por'){if(!sig)return'';const p=prof(sig.id);
  return `<span class="stamp">${pre} ${esc(p.nome)}${p.conselho?', '+esc(p.conselho):p.cat==='estag'?', estagiária':''}<br>${fmt(sig.d)} às ${esc(sig.h)}</span>`}
const sigCurta=sig=>sig?`${esc(primeiro(prof(sig.id).nome))} ${esc(sig.h)}`:'';
const codigoHoje=(sid,dt=T)=>{const m=S.escalaMes[dt.slice(0,7)];const a=m&&m[sid];return a?a[parse(dt).getDate()-1]||'':''};
const alergiaHTML=r=>r.alergias&&r.alergias.trim()?`<span class="allergy tem">Alergia: ${esc(r.alergias)}</span>`:`<span class="allergy nega">Nega alergia</span>`;

const presAtiva=(p,dt)=>!p.suspensa&&p.inicio<=dt&&(!p.fim||p.fim>=dt);
function horariosNoDia(p,dt){
  if(!presAtiva(p,dt))return[];
  if(p.tipo==='fixo')return p.horarios;
  if(p.tipo==='semanal')return p.dias.includes(parse(dt).getDay())?p.horarios:[];
  if(p.tipo==='intervalo'){const n=diffDays(dt,p.inicio);return n>=0&&n%(p.intervalo||1)===0?p.horarios:[]}
  return[];
}
function freqTxt(p){
  if(p.tipo==='sn')return `Se necessário${p.obs?'. '+p.obs:''}`;
  const h=p.horarios.join(', ');
  if(p.tipo==='semanal')return `${p.dias.map(i=>DIAS[i]).join(' e ')}, às ${h}`;
  if(p.tipo==='intervalo')return `A cada ${p.intervalo} dias, às ${h}`;
  return `Diário, às ${h}`;
}
function dosesDia(r,dt){const out=[];r.presc.forEach(p=>horariosNoDia(p,dt).forEach(h=>out.push({key:`${r.id}|${p.id}|${h}`,hora:h,r,p})));return out}
const regAdm=(key,dt=T)=>(S.adm[dt]||{})[key];
function consumoDia(r,it){let c=0;r.presc.forEach(p=>{if(p.estoqueId!==it.id||!presAtiva(p,T)||p.tipo==='sn')return;
  const base=(p.consumo||0)*p.horarios.length;c+=p.tipo==='semanal'?base*p.dias.length/7:p.tipo==='intervalo'?base/(p.intervalo||1):base});return c}
const diasRest=(c,q)=>c>0?q/c:Infinity;
function nivelEst(c,it){const d=diasRest(c,it.qtd);if(it.qtd<=0||d<=3)return'danger';if(d<=7||it.qtd<it.min)return'warn';return'ok'}
const compra30=(c,it)=>Math.max(0,Math.ceil(c*30+(it.min||0)-it.qtd));
const ultAval=(r,k)=>r.aval.filter(a=>a.esc===k).sort((a,b)=>b.d.localeCompare(a.d))[0];
function grau(r){const a=ultAval(r,'fugulin');return a?SCALES.fugulin.classif(totalEsc('fugulin',a.resp)).grau:null}
const docsPend=r=>DOCS.filter(([k])=>k!=='obito'&&k!=='convenio'&&!(r.docs||{})[k]);
const anotHoje=r=>r.anot.filter(a=>a.sig.d===T);

function parsePA(pa){const m=String(pa||'').match(/(\d{2,3})\D+(\d{2,3})/);return m?[+m[1],+m[2]]:null}
function flags(a){const f={};const pa=parsePA(a.pa);
  if(pa){if(pa[0]>=140||pa[1]>=90)f.pa='PA elevada';else if(pa[0]<90||pa[1]<60)f.pa='PA baixa'}
  const p=toNum(a.pulso),rr=toNum(a.resp),t=toNum(a.temp),s=toNum(a.sat);
  if(p!=null&&(p<60||p>100))f.pulso=p<60?'Bradicardia':'Taquicardia';
  if(rr!=null&&(rr<12||rr>24))f.resp=rr<12?'Bradipneia':'Taquipneia';
  if(t!=null&&(t<35||t>=37.8))f.temp=t<35?'Hipotermia':'Febre';
  if(s!=null&&s<92)f.sat='Saturação baixa';
  return f}
function variacaoPeso(r){const ps=r.evol.filter(e=>e.peso).sort((a,b)=>a.sig.d.localeCompare(b.sig.d));if(ps.length<2)return null;
  const last=ps[ps.length-1];const ref=[...ps].reverse().find(e=>diffDays(last.sig.d,e.sig.d)>=80)||ps[0];
  return {pct:(last.peso-ref.peso)/ref.peso*100,de:ref,ate:last}}
function sugestoes(r){const s={};const sc=(k)=>{const a=ultAval(r,k);return a?totalEsc(k,a.resp):null};
  const m=sc('morse'),b=sc('braden'),n=sc('mna'),g=sc('glasgow'),gr=grau(r);
  if(m!=null&&m>=25)s.quedas=`Morse ${m}`;
  if(b!=null&&b<=18)s.pele=`Braden ${b}`;
  if(n!=null&&n<=11)s.alimentacao=`MNA ${n}`;
  const vp=variacaoPeso(r);if(vp&&Math.abs(vp.pct)>=5)s.alimentacao=`Variação de peso de ${num(vp.pct)}%`;
  if(g!=null&&g<15)s.cognicao=`Glasgow ${g}`;
  if((r.doencas||[]).includes('Demência'))s.cognicao='Demência';
  if(gr&&gr>=2){s.mobilidade=`Grau ${gr} de dependência`;s.higiene=`Grau ${gr} de dependência`}
  const nMed=r.presc.filter(p=>presAtiva(p,T)&&p.estoqueId).length;if(nMed>=5)s.medicamentos=`Polifarmácia (${nMed} medicamentos)`;
  if((r.doencas||[]).some(x=>['HAS','Diabetes','IRC','DPOC','AVE'].includes(x)))s.cronicas=(r.doencas||[]).join(', ');
  s.autonomia=s.autonomia||'Recomendado para todos';
  return s}

function alertas(){
  const a=[];const gerir=can('gerir');
  const atrasadas=[];ativos().forEach(r=>dosesDia(r,T).forEach(x=>{if(!regAdm(x.key)&&minAgora()-minDe(x.hora)>30)atrasadas.push(x)}));
  if(atrasadas.length&&can('adm'))a.push({n:'danger',t:`${atrasadas.length} dose${atrasadas.length>1?'s':''} sem checagem`,s:[...new Set(atrasadas.map(x=>primeiro(x.r.nome)))].join(', '),go:'plantao'});
  if([...NURSE,'med'].includes(me().cat))ativos().forEach(r=>{const ult=anotHoje(r).slice(-1)[0];if(ult){const f=Object.values(flags(ult));if(f.length)a.push({n:'danger',t:`${primeiro(r.nome)}: ${f.join(', ').toLowerCase()}`,s:`Anotação de ${ult.sig.h} por ${primeiro(prof(ult.sig.id).nome)}. Comunicar enfermeiro(a).`,go:'res:'+r.id+':anot'})}});
  if(!NURSE.includes(me().cat))return a;
  const tHoje=S.temperaturas.filter(t=>t.d===T);const ultT=S.temperaturas[S.temperaturas.length-1];
  if(ultT&&[ultT.max,ultT.min,ultT.mom].some(v=>v<2||v>8))a.push({n:'danger',t:'Geladeira fora da faixa de 2 a 8 °C',s:`Registro de ${fmtDM(ultT.d)} às ${ultT.h}`,go:'rotinas'});
  if(!tHoje.some(t=>t.turno==='manha')&&minAgora()>minDe('08:00'))a.push({n:'warn',t:'Temperatura da geladeira da manhã não registrada',s:'Registro previsto às 7h',go:'rotinas'});
  if(!gerir)return a;
  ativos().forEach(r=>r.estoque.forEach(it=>{const c=consumoDia(r,it);const nv=nivelEst(c,it);if(nv==='ok')return;const d=diasRest(c,it.qtd);
    a.push({n:nv,t:isFinite(d)?`${it.nome} de ${primeiro(r.nome)} acaba em ${Math.max(0,Math.floor(d))} dia${Math.floor(d)===1?'':'s'}`:`${it.nome} de ${primeiro(r.nome)} abaixo do mínimo`,s:`Restam ${num(it.qtd)} ${it.unid}. Avisar ${r.responsavel?.nome||'a família'}.`,go:'res:'+r.id+':estoque'})}));
  S.casa.forEach(it=>{const nv=nivelEst(it.consumoDia,it);if(nv!=='ok')a.push({n:nv,t:`${it.nome} (estoque da casa) acabando`,s:`Restam ${num(it.qtd)} ${it.unid}`,go:'estoque'})});
  S.documentos.forEach(d=>{const n=diffDays(d.validade,T);
    if(n<0)a.push({n:'danger',t:`${d.nome} vencido há ${-n} dias`,s:d.orgao,go:'gestao'});
    else if(n<=60)a.push({n:n<=15?'danger':'warn',t:`${d.nome} vence em ${n} dia${n===1?'':'s'}`,s:`${d.orgao}. Validade ${fmt(d.validade)}`,go:'gestao'})});
  const semSSVV=ativos().filter(r=>!anotHoje(r).length&&r.cuidados.some(c=>/ssvv|sinais vitais/i.test(c.texto)));
  if(semSSVV.length&&minAgora()>minDe('10:00'))a.push({n:'warn',t:`SSVV sem anotação hoje: ${semSSVV.map(r=>primeiro(r.nome)).join(', ')}`,s:'Prescrição de enfermagem do plano de cuidados',go:'plantao'});
  ativos().forEach(r=>{const vp=variacaoPeso(r);if(vp&&Math.abs(vp.pct)>=5)a.push({n:'warn',t:`${primeiro(r.nome)} ${vp.pct>0?'ganhou':'perdeu'} ${num(Math.abs(vp.pct))}% do peso`,s:`De ${num(vp.de.peso)} kg (${fmtDM(vp.de.sig.d)}) para ${num(vp.ate.peso)} kg (${fmtDM(vp.ate.sig.d)})`,go:'res:'+r.id+':evol'})});
  ativos().forEach(r=>{const f=ultAval(r,'fugulin');if(!f||diffDays(T,f.d)>90)a.push({n:'warn',t:`Reavaliar Fugulin de ${primeiro(r.nome)}`,s:f?`Última em ${fmt(f.d)}`:'Sem avaliação',go:'res:'+r.id+':aval'});
    r.pia.forEach(p=>{if(p.reav&&p.reav<T&&!p.resultado)a.push({n:'warn',t:`PIA de ${primeiro(r.nome)} passou da data de reavaliação`,s:`Previsto para ${fmt(p.reav)}`,go:'res:'+r.id+':pia'})});
    if(!r.pia.length)a.push({n:'warn',t:`${primeiro(r.nome)} ainda não tem PIA de enfermagem`,s:'Plano individual de atenção',go:'res:'+r.id+':pia'})});
  if(!S.treinamentos.some(t=>t.data.startsWith(MK)))a.push({n:'warn',t:`Treinamento de ${MESES[TODAY.getMonth()]} ainda não registrado`,s:'Treinamento mensal da equipe',go:'equipe'});
  const pv=S.pops.filter(p=>diffDays(T,p.revisao)>365);if(pv.length)a.push({n:'warn',t:`${pv.length} documento${pv.length>1?'s':''} técnico${pv.length>1?'s':''} sem revisão há mais de 1 ano`,s:pv.map(p=>p.titulo).join(', '),go:'gestao'});
  const dp=ativos().filter(r=>docsPend(r).length);if(dp.length)a.push({n:'warn',t:`Documentos pendentes: ${dp.map(r=>primeiro(r.nome)).join(', ')}`,s:'Ficha de acolhimento',go:'res:'+dp[0].id+':ficha'});
  return a.sort((x,y)=>(x.n==='danger'?0:1)-(y.n==='danger'?0:1));
}

  gestao:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M9 12l2 2 4-4"/></svg>'};
const NAMES={plantao:'Plantão',residentes:'Residentes',estoque:'Estoque',rotinas:'Rotinas',equipe:'Equipe',gestao:'Gestão'};
let view='plantao',selRes=null,resTab='pasta',semana=0,brush='D',escMes=MK,indMes=MK,estSeg='res';

function renderNav(){

function whobar(){return `<div class="whobar"><label for="who">Entrou como</label><select id="who" data-change="user">${S.equipe.map(p=>`<option value="${p.id}" ${p.id===S.user?'selected':''}>${esc(p.nome)} (${esc(p.funcao)})</option>`).join('')}</select></div>`}
function render(){if(!navVisivel().includes(view))view='plantao';renderNav();document.getElementById('main').innerHTML=whobar()+V[view]()}
function go(dest){
  if(dest.startsWith('res:')){const [,id,tab]=dest.split(':');selRes=id;resTab=tab||'pasta';dest='residentes'}
  else if(dest==='residentes')selRes=null;
  if(location.hash.slice(1)!==dest)location.hash=dest;else{view=dest;render()}

/* ================= tela: plantão ================= */
const V={};
V.plantao=()=>{
  const u=me();const cod=codigoHoje(u.id);const al=alertas();
  const dataExt=TODAY.toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'});
  const minhas=S.tarefas.filter(t=>t.resp===u.id&&t.dias.includes(TODAY.getDay()));const feitas=S.feitas[T]||[];
  let h=`<p class="today-date">${esc(cap(dataExt))}</p><h1>Olá, ${esc(primeiro(u.nome))}</h1>
  <div class="shift">${cod?`<span class="code c-${cod}">${cod}</span> Hoje: ${esc(COD[cod]||cod)}`:`<span class="muted">${NURSE.includes(u.cat)||u.cat==='cuid'?'Sem escala lançada para hoje':esc(u.funcao)}</span>`}</div>`;
  if(al.length)h+=`<div class="alerts">${al.map(a=>`<button class="alert ${a.n}" data-go="${a.go}"><strong>${esc(a.t)}</strong><span>${esc(a.s)}</span><em class="go">Abrir</em></button>`).join('')}</div>`;
  else if(can('gerir'))h+=`<div class="allgood">Nenhuma pendência. Bom plantão.</div>`;
  if(can('adm'))h+=cardRonda();
  if(can('cuid'))h+=cardCuidados();
  if(can('anot'))h+=cardSSVV();
  if(minhas.length)h+=`<section class="card"><h2>Minhas tarefas de hoje</h2>${minhas.map(t=>{const f=feitas.includes(t.id);return `<button class="check" data-action="tarefa" data-id="${t.id}" aria-pressed="${f}"><span class="box">${f?'✓':''}</span>${esc(t.tarefa)}</button>`}).join('')}</section>`;
  if(['med','multi'].includes(u.cat))h+=cardMulti();
  return h;
};
function cardRonda(){
  const ds=[];ativos().forEach(r=>ds.push(...dosesDia(r,T)));ds.sort((a,b)=>a.hora.localeCompare(b.hora)||a.r.nome.localeCompare(b.r.nome));
  const horas=[...new Set(ds.map(x=>x.hora))];const ag=minAgora();const feitas=ds.filter(x=>regAdm(x.key)).length;
  const sns=[];ativos().forEach(r=>r.presc.filter(p=>p.tipo==='sn'&&presAtiva(p,T)).forEach(p=>sns.push({r,p})));
  return `<section class="card"><div class="card-h"><h2>Medicação</h2><span class="muted">${feitas} de ${ds.length} checadas</span></div>
  <p class="hint">Toque na dose para checar. A baixa no estoque do residente é automática.</p>
  <div class="ronda">${horas.map(hh=>`<div class="slot ${minDe(hh)<ag-30?'past':''}"><div class="hora">${hh}</div><div class="doses">${ds.filter(x=>x.hora===hh).map(x=>{const g=regAdm(x.key);const late=!g&&ag-minDe(hh)>30;
    return `<button class="dose ${g?g.st:late?'late':''}" data-action="dose" data-key="${x.key}" data-dt="${T}"><span class="who">${esc(primeiro(x.r.nome))}, quarto ${esc(x.r.quarto)}</span><span class="what">${esc(x.p.med)}, ${esc(x.p.dose)} ${esc(x.p.via)}</span>${g?`<span class="by">${g.st==='dado'?'✓ Administrado':g.st==='recusado'?'Recusado':'Não administrado'}, ${sigCurta(g.sig)}</span>`:''}</button>`}).join('')}</div></div>`).join('')||'<p class="muted">Nenhuma dose prevista para hoje.</p>'}</div>
  ${sns.length?`<h3>Se necessário</h3><div class="doses" style="margin-top:8px">${sns.map(({r,p})=>{const hoje=S.sn.filter(x=>x.resId===r.id&&x.pId===p.id&&x.sig.d===T).length;return `<button class="dose" data-action="sn" data-r="${r.id}" data-p="${p.id}"><span class="who">${esc(primeiro(r.nome))}</span><span class="what">${esc(p.med)}, ${esc(p.dose)}. ${esc(p.obs)}</span>${hoje?`<span class="by" style="color:var(--accent)">${hoje}x hoje</span>`:''}</button>`}).join('')}</div>`:''}
  </section>`;
}
function cuidadosVisiveis(r){const c=me().cat;return r.cuidados.filter(x=>x.quem==='todos'||(x.quem==='enfermagem'&&NURSE.includes(c))||(x.quem==='cuidador'&&(c==='cuid'||NURSE.includes(c))))}
function cardCuidados(){
  const chk=S.cuidChk[T]||{};
  return `<section class="card"><div class="card-h"><h2>Plano de cuidados</h2><span class="muted">Prescrição de enfermagem de hoje</span></div>
  <p class="hint">Marque quando o cuidado for atendido. Fica registrado com seu nome e horário.</p>
  ${ativos().map(r=>{const cs=cuidadosVisiveis(r);if(!cs.length)return'';const ok=cs.filter(c=>chk[`${r.id}|${c.id}`]).length;
    return `<div class="rescare"><div class="card-h"><h3 style="margin:0;display:flex;gap:10px;align-items:center">${avatar(r,'sm')}<span>${esc(r.nome)} <span class="muted small">quarto ${esc(r.quarto)}</span></span></h3><span class="badge ${ok===cs.length?'ok':''}">${ok}/${cs.length}</span></div>
    ${cs.map(c=>{const g=chk[`${r.id}|${c.id}`];return `<button class="check" data-action="cuid" data-r="${r.id}" data-c="${c.id}" aria-pressed="${!!g}"><span class="box">${g?'✓':''}</span><span>${esc(c.texto)}</span>${g?`<span class="by">AT ${sigCurta(g)}</span>`:''}</button>`}).join('')}</div>`}).join('')}
  </section>`;
}
function cardSSVV(){
  return `<section class="card"><div class="card-h"><h2>Sinais vitais e anotação</h2><span class="muted">${ativos().filter(r=>anotHoje(r).length).length} de ${ativos().length} hoje</span></div>
  <div class="list">${ativos().map(r=>{const a=anotHoje(r).slice(-1)[0];const f=a?flags(a):{};
    return `<div class="li">${avatar(r,'sm')}<div class="main"><b>${esc(r.nome)}</b><div class="sub">${a?`${esc(a.sig.h)} por ${esc(primeiro(prof(a.sig.id).nome))}`:'Sem anotação hoje'}</div>${a?vitaisHTML(a,f):''}</div><button class="btn sm ${a?'':'primary'}" data-action="anot-nova" data-r="${r.id}">${a?'Nova anotação':'Anotar'}</button></div>`}).join('')}</div></section>`;
}
function vitaisHTML(a,f=flags(a)){const v=(k,l,val,u='')=>val!==''&&val!=null?`<span class="vit ${f[k]?'alt':''}" title="${esc(f[k]||'')}">${l} ${esc(String(val).replace('.',','))}${u}</span>`:'';
  return `<div>${v('pa','PA',a.pa)}${v('pulso','P',a.pulso)}${v('resp','R',a.resp)}${v('temp','T',a.temp,' °C')}${v('sat','Sat',a.sat,'%')}${a.evac?`<span class="vit">Evac ${esc(a.evac)}</span>`:''}${a.diurese?`<span class="vit">Diurese ${esc(a.diurese)}</span>`:''}</div>`}
function cardMulti(){
  const u=me();const ag=[];ativos().forEach(r=>(r.agenda||[]).filter(x=>x.area===u.area&&x.d===T).forEach(x=>ag.push({r,x})));
  return `<section class="card"><h2>${esc(u.area||'Atendimentos')}</h2><p class="hint">Abra a pasta do residente para registrar sua evolução.</p>
  ${ag.length?ag.map(({r,x})=>`<div class="li"><div class="main"><b>${esc(r.nome)}</b><div class="sub">${esc(x.atividade)}</div></div>${x.sig?stamp(x.sig,'Realizado por'):`<button class="btn sm primary" data-action="agenda-ok" data-r="${r.id}" data-id="${x.id}">Marcar realizada</button>`}</div>`).join(''):'<p class="muted">Nenhuma atividade planejada para hoje.</p>'}
  <div class="list" style="margin-top:8px">${ativos().map(r=>`<div class="li">${avatar(r,'sm')}<div class="main"><b>${esc(r.nome)}</b></div><button class="btn sm" data-go="res:${r.id}:pasta">Abrir pasta</button></div>`).join('')}</div></section>`;
}

/* ================= tela: residentes ================= */
const RTABS={pasta:'Pasta',ficha:'Ficha',aval:'Avaliações',pia:'PIA enfermagem',cuidados:'Plano de cuidados',presc:'Prescrição médica',anot:'Anotações',evol:'Evolução',arquivos:'Exames e documentos',estoque:'Estoque'};
V.residentes=()=>{
  if(selRes&&res(selRes))return resDetalhe(res(selRes));
  const lista=[...S.residentes].sort((a,b)=>(a.status==='obito')-(b.status==='obito')||String(a.quarto).localeCompare(String(b.quarto),'pt',{numeric:true}));

  <div class="res-list">${lista.map(r=>{const g=grau(r);const pend=can('gerir')?docsPend(r).length:0;
    const baixo=can('estoque')?r.estoque.filter(it=>nivelEst(consumoDia(r,it),it)!=='ok').length:0;

      ${avatar(r)}
      <span class="info"><h3 style="margin:0">${esc(r.nome)}</h3>

      <span class="row" style="gap:6px">${g?`<span class="badge ${g===1?'ok':g===2?'warn':'danger'}">Grau ${g}</span>`:'<span class="badge warn">Sem Fugulin</span>'}${pend?`<span class="badge warn">${pend} doc. pendente${pend>1?'s':''}</span>`:''}${baixo?`<span class="badge danger">${baixo} remédio${baixo>1?'s':''} acabando</span>`:''}</span></span>
    </button>`}).join('')}</div>`;
};
const podeFoto=()=>['rt','enf','tec'].includes(me().cat);
function resDetalhe(r){
  const g=grau(r);if(!pode(TAB_ACESSO,resTab))resTab='pasta';
  const tabs=Object.entries(RTABS).filter(([k])=>pode(TAB_ACESSO,k)&&(k!=='aval'||escalasVisiveis().length));if(!tabs.some(([k])=>k===resTab)&&resTab!=='tudo')resTab='pasta';
  return `<button class="back" data-action="res-voltar">Todas as pastas</button>
  <div class="pasta-head">
    ${podeFoto()?`<button class="photo-btn" data-action="foto" aria-label="${r.foto?'Trocar':'Adicionar'} foto de ${esc(r.nome)}">${avatar(r,'lg')}<span class="cam">${r.foto?'Trocar foto':'Adicionar foto'}</span></button>`:avatar(r,'lg')}
    <div class="info"><h1>${esc(r.nome)}</h1>
    <p class="muted" style="margin:4px 0 8px">${idade(r.nasc)} anos, quarto ${esc(r.quarto)}, acolhido(a) em ${fmt(r.admissao)}${g?`, grau ${g} de dependência`:''}${r.status==='obito'?`. Óbito em ${fmt(r.obitoData)}`:''}</p>
    ${alergiaHTML(r)}</div>
  </div>
  <input type="file" id="foto-in" accept="image/*" hidden data-change="foto">
  <div class="tabs" role="tablist">${tabs.map(([k,l])=>`<button class="tab" data-action="rtab" data-t="${k}" aria-current="${resTab===k}">${l}</button>`).join('')}</div>
  ${RT[resTab](r)}`;
}
const RT={};
const lock=t=>`<p class="lock">${t}</p>`;

/* ---- pasta (resumo do prontuário) ---- */
const kv=rows=>`<dl class="kv">${rows.filter(([,v])=>v!==''&&v!=null).map(([k,v])=>`<dt>${k}</dt><dd>${v}</dd>`).join('')}</dl>`;
RT.pasta=r=>{
  const u=me();const multi=u.cat==='multi';const enfm=[...NURSE,'med'].includes(u.cat);
  const riscos=escalasVisiveis().map(k=>{const a=ultAval(r,k);if(!a)return'';const c=SCALES[k].classif(totalEsc(k,a.resp));return `<span class="badge ${c.nivel}">${SCALES[k].nome}: ${c.txt}</span>`}).join(' ');
  const ultA=[...r.anot].sort((a,b)=>(b.sig.d+b.sig.h).localeCompare(a.sig.d+a.sig.h))[0];
  const evs=[...r.evol].filter(e=>!multi||e.area===u.area).sort((a,b)=>(b.sig.d+b.sig.h).localeCompare(a.sig.d+a.sig.h)).slice(0,3);
  const meds=r.presc.filter(p=>presAtiva(p,T));
  const pr=r.pref||{};
  const cards=[];
  cards.push(`<section class="card"><h2>Identificação</h2>${kv([['Nascimento',fmt(r.nasc)],['Sexo',r.sexo==='F'?'Feminino':r.sexo==='M'?'Masculino':''],['Quarto',esc(r.quarto)],['Acolhimento',fmt(r.admissao)],['Convênio',esc(r.convenio||'')],['Médico(a)',esc(prof(r.medico).nome)],...(multi?[]:[['Responsável',r.responsavel?.nome?`${esc(r.responsavel.nome)}${r.responsavel.parentesco?` (${esc(r.responsavel.parentesco)})`:''}`:''],['Telefone',esc(r.responsavel?.tel||'')]])])}</section>`);
  cards.push(`<section class="card"><h2>Saúde</h2>${kv([['Alergias',r.alergias?`<b style="color:var(--danger)">${esc(r.alergias)}</b>`:'Nega'],['Doenças de base',esc([...(r.doencas||[]),r.outras].filter(Boolean).join(', ')||'Nenhuma registrada')],['Cirurgias',esc(r.cirurgias||'')],['Dependência',grau(r)?`Grau ${grau(r)}`:'Não avaliado']])}${riscos?`<div class="row" style="gap:6px;margin-top:10px">${riscos}</div>`:''}</section>`);
  cards.push(`<section class="card"><h2>Do que gosta</h2>${kv([['Atividades',esc(pr.gosta||'')],['Não gosta',esc(pr.naoGosta||'')],['Música',esc(pr.musica||'')],['Comida',esc(pr.comida||'')],['Evitar',esc(pr.comidaNao||'')],['Religião',esc(pr.religiao||'')],['Melhor horário',esc(pr.horario||'')]])||'<p class="muted">Ainda não preenchido.</p>'}</section>`);
  if(pode(TAB_ACESSO,'presc'))cards.push(`<section class="card"><div class="card-h"><h2>Medicação em uso</h2><button class="btn ghost sm" data-action="rtab" data-t="presc">Ver prescrição</button></div><div class="list">${meds.map(p=>`<div class="li" style="padding:8px 0"><div class="main"><b>${esc(p.med)}</b> <span class="muted small">${esc(p.dose)} ${esc(p.via)}</span><div class="sub">${esc(freqTxt(p))}</div></div></div>`).join('')||'<p class="muted">Sem prescrição.</p>'}</div></section>`);
  if(u.cat==='cuid'||NURSE.includes(u.cat))cards.push(`<section class="card"><div class="card-h"><h2>Cuidados prescritos</h2><button class="btn ghost sm" data-action="rtab" data-t="cuidados">Ver semana</button></div>${cuidadosVisiveis(r).map(c=>`<p style="margin:8px 0">• ${esc(c.texto)}</p>`).join('')||'<p class="muted">Nenhum cuidado.</p>'}</section>`);
  if(enfm)cards.push(`<section class="card"><div class="card-h"><h2>Últimos sinais vitais</h2><button class="btn ghost sm" data-action="rtab" data-t="anot">Ver anotações</button></div>${ultA?`<p class="muted small" style="margin:8px 0 4px">${fmt(ultA.sig.d)} às ${esc(ultA.sig.h)} por ${esc(primeiro(prof(ultA.sig.id).nome))}</p>${vitaisHTML(ultA)}<p style="margin:8px 0 0">${esc(ultA.texto)}</p>`:'<p class="muted">Sem anotações.</p>'}</section>`);
  if(pode(TAB_ACESSO,'evol'))cards.push(`<section class="card"><div class="card-h"><h2>${multi?`Minhas evoluções (${esc(u.area)})`:'Últimas evoluções'}</h2><button class="btn ghost sm" data-action="rtab" data-t="evol">${multi?'Registrar':'Ver todas'}</button></div>${evs.map(e=>`<div class="anot"><b>${esc(e.area)}, ${fmt(e.sig.d)}</b><p>${esc(e.texto)}</p></div>`).join('')||'<p class="muted">Nenhuma evolução.</p>'}</section>`);
  if(pode(TAB_ACESSO,'arquivos')){const fs=r.arquivos.slice(-3).reverse();cards.push(`<section class="card"><div class="card-h"><h2>Exames e documentos</h2><button class="btn ghost sm" data-action="rtab" data-t="arquivos">Abrir (${r.arquivos.length})</button></div>${fs.map(f=>`<p style="margin:8px 0">• ${esc(f.cat)}: ${esc(f.nome)} <span class="muted small">${fmt(f.data)}</span></p>`).join('')||'<p class="muted">Nenhum arquivo anexado.</p>'}</section>`)}
  if(can('gerir')){const pend=docsPend(r);cards.push(`<section class="card"><div class="card-h"><h2>Documentos do acolhimento</h2><button class="btn ghost sm" data-action="rtab" data-t="ficha">Abrir ficha</button></div>${pend.length?`<p class="muted" style="margin:8px 0 0">Faltam: ${pend.map(([,l])=>l).join(', ')}</p>`:'<p style="margin:8px 0 0" class="muted">Todos entregues.</p>'}</section>`)}
  return `${pode(TAB_ACESSO,'tudo')?`<p class="row" style="margin-top:16px"><button class="btn" data-action="rtab" data-t="tudo">Ver prontuário completo</button></p>`:''}<div class="sumgrid">${cards.join('')}</div>`;
};

/* ---- exames e documentos ---- */
RT.arquivos=r=>{
  const up=['rt','enf','tec','med','multi'].includes(me().cat)&&r.status!=='obito';
  const vis=r.arquivos.filter(f=>me().cat!=='multi'||f.area===me().area||f.cat!=='Laudo');

  ${vis.length?`<div class="files">${[...vis].reverse().map(f=>`<button class="file" data-action="arq-ver" data-id="${f.id}"><span class="thumb">${f.tipo.startsWith('image/')?`<img src="${esc(f.dado)}" alt="">`:'PDF'}</span><span class="meta"><b>${esc(f.nome)}</b><span class="muted">${esc(f.cat)}, ${fmt(f.data)}</span></span></button>`).join('')}</div>`:'<p class="muted">Nenhum arquivo ainda.</p>'}
  <p class="lock">Neste protótipo os arquivos ficam neste aparelho, com espaço limitado. Na versão final eles vão para um servidor seguro.</p></section>`;
};

/* ---- prontuário completo ---- */
RT.tudo=r=>{
  const secs=['ficha','aval','pia','cuidados','presc','anot','evol'].filter(k=>pode(TAB_ACESSO,k));
  return `<p class="row" style="margin-top:16px"><button class="btn primary" data-action="imprimir">Imprimir ou salvar em PDF</button><button class="btn" data-action="rtab" data-t="pasta">Voltar à pasta</button></p>

  ${secs.map(k=>`<h2 class="sec-title">${RTABS[k]}</h2>${RT[k](r)}`).join('')}`;

/* ---- ficha de acolhimento ---- */
RT.ficha=r=>{
  const ed=can('gerir');const dis=ed?'':'disabled';
  const inp=(l,f,type='text')=>`<label class="f">${l}<input type="${type}" value="${esc(getPath(r,f)??'')}" data-change="rf" data-f="${f}" ${dis}></label>`;
  const sel=(l,f,ops)=>`<label class="f">${l}<select data-change="rf" data-f="${f}" ${dis}><option value=""></option>${ops.map(o=>{const [v,t]=Array.isArray(o)?o:[o,o];return `<option value="${esc(v)}" ${getPath(r,f)===v?'selected':''}>${esc(t)}</option>`}).join('')}</select></label>`;

/* ---- plano de cuidados (prescrição de enfermagem) ---- */

RT.cuidados=r=>{

    ${ds.map(d=>{const g=(S.cuidChk[d]||{})[`${r.id}|${c.id}`];return `<td class="${d===T?'today-col':''}">${g?`<span class="ms dado">AT ${sigCurta(g)}</span>`:d<T?'<span class="ms late">–</span>':'<span class="ms fut">·</span>'}</td>`}).join('')}</tr>`).join('')||'<tr><td colspan="8" class="muted">Nenhum cuidado prescrito.</td></tr>'}</tbody></table></div>

/* ---- prescrição médica ---- */
RT.presc=r=>{
  const ds=semanaDias();const ativas=r.presc.filter(p=>!p.suspensa);const ag=minAgora();
  const cell=(p,d)=>{const hs=horariosNoDia(p,d);if(!hs.length)return'';return hs.map(h=>{const g=regAdm(`${r.id}|${p.id}|${h}`,d);
    const cls=g?g.st:(d<T||(d===T&&ag-minDe(h)>30))?'late':'fut';const lb=g?(g.st==='dado'?'✓':g.st==='recusado'?'Rec':'✗'):cls==='late'?'!':'';
    return `<span class="ms ${cls}" title="${g?esc(prof(g.sig.id).nome)+' '+g.sig.h:''}">${h.slice(0,2)}h ${lb}</span>`}).join('')};
  return `<section class="card"><div class="card-h"><h2>Prescrição médica</h2>${can('presc')&&r.status!=='obito'?'<button class="btn sm primary" data-action="presc-novo">Incluir item</button>':''}</div>
  <p class="hint">Médico(a): ${esc(prof(r.medico).nome)}. Cada medicamento está ligado ao estoque do residente.</p>
  <div class="list">${ativas.map(p=>{const it=r.estoque.find(e=>e.id===p.estoqueId);const c=it?consumoDia(r,it):0;
    return `<div class="li"><div class="main"><b>${esc(p.med)}</b> <span class="muted">${esc(p.dose)} ${esc(p.via)}</span><div class="sub">${esc(freqTxt(p))}</div>
      ${it?`<div class="sub">Estoque: ${num(it.qtd)} ${esc(it.unid)}${c?`, dura ${Math.floor(diasRest(c,it.qtd))} dias`:''}</div>`:'<div class="sub">Sem estoque vinculado</div>'}</div>
      ${it?`<span class="badge ${nivelEst(c,it)}">${nivelEst(c,it)==='ok'?'Estoque ok':nivelEst(c,it)==='warn'?'Acabando':'Crítico'}</span>`:''}
      ${can('presc')?`<button class="btn sm ghost danger" data-action="presc-susp" data-id="${p.id}">Suspender</button>`:''}</div>`}).join('')||'<p class="muted">Sem prescrições.</p>'}</div>
  ${can('presc')?'':lock('Somente médico(a) ou enfermeiro(a) transcrevendo a prescrição podem alterar.')}</section>
  <section class="card"><h2>Checagem</h2><p class="hint">✓ administrado, Rec recusado, ✗ não administrado, ! sem checagem.</p>${semanaNav()}
  <div class="tablewrap"><table class="grid-t"><thead><tr><th>Medicamento</th>${ds.map(d=>`<th class="${d===T?'today-col':''}">${DIAS[parse(d).getDay()]} ${fmtDM(d)}</th>`).join('')}</tr></thead>
  <tbody>${r.presc.filter(p=>p.tipo!=='sn').map(p=>`<tr><td style="white-space:normal">${esc(p.med)}<div class="muted small">${esc(p.dose)} ${esc(p.via)}${p.suspensa?', suspenso':''}</div></td>${ds.map(d=>`<td class="${d===T?'today-col':''}">${cell(p,d)}</td>`).join('')}</tr>`).join('')}
  ${r.presc.filter(p=>p.tipo==='sn').map(p=>`<tr><td style="white-space:normal">${esc(p.med)}<div class="muted small">SN. ${esc(p.obs)}</div></td>${ds.map(d=>{const n=S.sn.filter(x=>x.resId===r.id&&x.pId===p.id&&x.sig.d===d);return `<td class="${d===T?'today-col':''}">${n.map(x=>`<span class="ms dado">${x.sig.h}</span>`).join('')}</td>`}).join('')}</tr>`).join('')}</tbody></table></div></section>`;
};

/* ---- anotações de enfermagem ---- */
function miniChart(series,labels,opts={}){
  const W=600,H=170,L=34,R=10,Tp=10,B=24;const all=series.flatMap(s=>s.v.filter(x=>x!=null));if(!all.length)return'';
  let mn=Math.min(...all,opts.min??Infinity),mx=Math.max(...all,opts.max??-Infinity);if(mn===mx){mn-=1;mx+=1}
  const n=labels.length;const x=i=>L+(n===1?(W-L-R)/2:i*(W-L-R)/(n-1));const y=v=>Tp+(mx-v)/(mx-mn)*(H-Tp-B);
  const ticks=[mn,(mn+mx)/2,mx];
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.label||'Gráfico')}">
  ${opts.band?`<rect x="${L}" y="${y(opts.band[1])}" width="${W-L-R}" height="${Math.max(0,y(opts.band[0])-y(opts.band[1]))}" fill="var(--ok-soft)"/>`:''}
  ${ticks.map(v=>`<text x="${L-6}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${Math.round(v)}</text>`).join('')}
  ${series.map(s=>`<polyline fill="none" stroke="${s.c}" stroke-width="2.5" points="${s.v.map((v,i)=>v==null?null:`${x(i)},${y(v)}`).filter(Boolean).join(' ')}"/>${s.v.map((v,i)=>v==null?'':`<circle cx="${x(i)}" cy="${y(v)}" r="${s.alt&&s.alt(v)?6:3.5}" fill="${s.alt&&s.alt(v)?'var(--danger)':s.c}"/>`).join('')}`).join('')}
  ${labels.map((l,i)=>i%Math.ceil(n/8)===0?`<text x="${x(i)}" y="${H-6}" text-anchor="middle" font-size="10" fill="var(--muted)">${esc(l)}</text>`:'').join('')}
  ${series.length>1?series.map((s,i)=>`<text x="${W-R-4}" y="${14+i*14}" text-anchor="end" font-size="11" fill="${s.c}">${esc(s.n)}</text>`).join(''):''}</svg>`;
}
RT.anot=r=>{
  const ls=[...r.anot].sort((a,b)=>(b.sig.d+b.sig.h).localeCompare(a.sig.d+a.sig.h));const ult=ls.slice(0,14).reverse();
  const evs=S.eventos.filter(e=>e.resId===r.id).sort((a,b)=>b.data.localeCompare(a.data));
  return `${can('anot')&&r.status!=='obito'?`<p style="margin-top:16px"><button class="btn primary" data-action="anot-nova" data-r="${r.id}">Nova anotação de enfermagem</button></p>`:''}
  ${ult.length>1?`<section class="card"><h2>Tendência</h2>${miniChart([{n:'PA sistólica',c:'var(--brand)',v:ult.map(a=>(parsePA(a.pa)||[])[0]??null),alt:v=>v>=140||v<90},{n:'PA diastólica',c:'var(--accent)',v:ult.map(a=>(parsePA(a.pa)||[])[1]??null),alt:v=>v>=90||v<60}],ult.map(a=>fmtDM(a.sig.d)),{label:'Pressão arterial'})}
    ${miniChart([{n:'Saturação',c:'var(--brand)',v:ult.map(a=>toNum(a.sat)),alt:v=>v<92}],ult.map(a=>fmtDM(a.sig.d)),{label:'Saturação',band:[92,100],min:88,max:100})}</section>`:''}
  <section class="card"><h2>Anotações</h2><div>${ls.map(a=>`<div class="anot"><b>${fmt(a.sig.d)} às ${esc(a.sig.h)}</b>${vitaisHTML(a)}${Object.values(flags(a)).length?`<span class="badge danger">${Object.values(flags(a)).join(', ')}</span>`:''}<p>${esc(a.texto)}</p>${stamp(a.sig)}</div>`).join('')||'<p class="muted">Nenhuma anotação.</p>'}</div></section>
  <section class="card"><h2>Ocorrências</h2><p class="hint">Alimentam os indicadores da Vigilância.</p>
    <div class="list">${evs.map(e=>`<div class="li"><div class="main"><b>${EVENTOS[e.tipo]}</b><div class="sub">${fmt(e.data)}</div></div>${can('gerir')?`<button class="btn sm ghost" data-action="ev-del" data-id="${e.id}">Remover</button>`:''}</div>`).join('')||'<p class="muted">Nenhuma ocorrência.</p>'}</div>
    ${can('anot')&&r.status!=='obito'?`<div class="row" style="margin-top:12px"><select id="ev-tipo" style="width:auto">${Object.entries(EVENTOS).filter(([k])=>k!=='obito').map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}</select><input type="date" id="ev-data" value="${T}" style="width:auto"><button class="btn" data-action="ev-add">Registrar</button></div>`:''}</section>`;
};

/* ---- evolução multiprofissional ---- */
const minhasAreas=()=>{const u=me();if(['rt','enf'].includes(u.cat))return['Enfermagem'];if(['med','multi'].includes(u.cat))return[u.area||'Medicina'];return[]};
RT.evol=r=>{
  const mine=minhasAreas();const areas=AREAS.filter(a=>r.evol.some(e=>e.area===a)||(r.agenda||[]).some(x=>x.area===a)||mine.includes(a)).filter(a=>me().cat!=='multi'||a===me().area);
  const pesos=r.evol.filter(e=>e.peso).sort((a,b)=>a.sig.d.localeCompare(b.sig.d));const vp=variacaoPeso(r);
  return `${mine.length&&r.status!=='obito'?`<p style="margin-top:16px" class="row"><button class="btn primary" data-action="evol-nova">Registrar evolução (${esc(mine[0])})</button><button class="btn" data-action="agenda-nova">Planejar atividades</button></p>`:lock('Aqui ficam as evoluções de enfermeiros, médico(a) e equipe multiprofissional.')}
  ${pesos.length>1&&(me().cat!=='multi'||me().area==='Nutrição')?`<section class="card"><div class="card-h"><h2>Peso</h2>${vp?`<span class="badge ${Math.abs(vp.pct)>=5?'warn':'ok'}">${vp.pct>0?'+':''}${num(vp.pct)}% desde ${fmtDM(vp.de.sig.d)}</span>`:''}</div>${miniChart([{n:'Peso',c:'var(--brand)',v:pesos.map(e=>e.peso)}],pesos.map(e=>fmtDM(e.sig.d)),{label:'Peso em kg'})}</section>`:''}
  ${areas.map(a=>{const es=r.evol.filter(e=>e.area===a).sort((x,y)=>(y.sig.d+y.sig.h).localeCompare(x.sig.d+x.sig.h));const ag=(r.agenda||[]).filter(x=>x.area===a).sort((x,y)=>x.d.localeCompare(y.d));
    return `<section class="card"><h2>${a}</h2>
    ${ag.length?`<h3>Atividades planejadas</h3><div class="list">${ag.map(x=>`<div class="li"><div class="main"><b>${fmtDM(x.d)}</b> ${esc(x.atividade)}</div>${x.sig?`<span class="badge ok">Realizada, ${sigCurta(x.sig)}</span>`:mine.includes(a)?`<button class="btn sm" data-action="agenda-ok" data-r="${r.id}" data-id="${x.id}">Marcar realizada</button>`:`<span class="badge">Prevista</span>`}</div>`).join('')}</div>`:''}
    ${es.length?`<h3>Evoluções</h3>`:''}${es.map(e=>`<div class="anot"><b>${fmt(e.sig.d)}${e.peso?`, ${num(e.peso)} kg`:''}</b><p>${esc(e.texto)}</p>${stamp(e.sig)}</div>`).join('')}</section>`}).join('')||'<section class="card"><p class="muted">Nenhuma evolução registrada.</p></section>'}`;
};

/* ---- estoque do residente ---- */
function itemEstHTML(r,it){const c=consumoDia(r,it);const d=diasRest(c,it.qtd);const nv=nivelEst(c,it);const pct=isFinite(d)?Math.min(100,d/30*100):100;
  const usos=r.presc.filter(p=>p.estoqueId===it.id&&presAtiva(p,T));
  return `<div class="stockrow" style="padding:12px 0;border-top:1px solid var(--line)"><div class="card-h"><b>${esc(it.nome)}</b><span class="badge ${nv}">${num(it.qtd)} ${esc(it.unid)}</span></div>
  <div style="height:10px;border-radius:6px;background:var(--bg);margin:8px 0 6px;overflow:hidden"><i style="display:block;height:100%;width:${pct}%;border-radius:6px;background:var(--${nv==='ok'?'ok':nv})"></i></div>
  <div class="small muted">${c?`Consumo ${num(c)} ${esc(it.unid)} por dia. Dura até ${fmtDM(addD(TODAY,Math.floor(d)))} (${Math.floor(d)} dias).`:usos.some(p=>p.tipo==='sn')?'Uso se necessário.':'Sem uso previsto.'} Mínimo ${num(it.min)}.${usos.length?` Prescrição: ${usos.map(p=>esc(freqTxt(p))).join('; ')}.`:''}</div>
  ${can('estoque')?`<div class="row" style="margin-top:8px"><button class="btn sm" data-action="entrada" data-r="${r.id}" data-id="${it.id}">Registrar entrada</button><button class="btn sm ghost" data-action="item-edit" data-r="${r.id}" data-id="${it.id}">Editar</button></div>`:''}</div>`}
RT.estoque=r=>`<section class="card"><div class="card-h"><h2>Medicamentos de ${esc(primeiro(r.nome))}</h2><div class="row">${can('gerir')?`<button class="btn sm primary" data-action="familia" data-r="${r.id}">Pedir à família</button>`:''}${can('estoque')?`<button class="btn sm ghost" data-action="item-edit" data-r="${r.id}">Novo item</button>`:''}</div></div>
  <p class="hint">O consumo vem da prescrição médica. Cada dose checada baixa daqui. Responsável: ${esc(r.responsavel?.nome||'não informado')} ${esc(r.responsavel?.tel||'')}</p>

/* ================= tela: estoque ================= */
V.estoque=()=>{
  let h=`<div class="card-h"><h1>Estoque</h1></div><p class="hint">Medicamentos são de cada residente e conversam com a prescrição médica. Materiais da casa têm consumo informado.</p>
  <div class="row"><div class="chips"><button class="chip" data-action="est-seg" data-v="res" aria-pressed="${estSeg==='res'}">Medicamentos dos residentes</button><button class="chip" data-action="est-seg" data-v="casa" aria-pressed="${estSeg==='casa'}">Materiais da casa</button></div></div>`;
  if(estSeg==='res'){

  const ev=S.eventos.filter(e=>e.data>=ini&&e.data<=fim);
  return {den,rows:[['obito','Taxa de mortalidade'],['dda','Incidência de doença diarreica aguda'],['escabiose','Incidência de escabiose'],['desidratacao','Incidência de desidratação'],['lpp','Prevalência de lesão por pressão'],['desnutricao','Prevalência de desnutrição']]
    .map(([k,n])=>{const c=['lpp','desnutricao'].includes(k)?new Set(ev.filter(e=>e.tipo===k).map(e=>e.resId)).size:ev.filter(e=>e.tipo===k).length;return {n,c,taxa:den?c/den*100:0}})}}

  'evol-nova'(){const area=minhasAreas()[0];openModal(head(`Evolução: ${area}`)+`<div class="form">${area==='Nutrição'?`<label class="f">Peso (kg)<input type="text" id="ev-peso" inputmode="decimal"></label>`:''}<label class="f">Evolução<textarea id="ev-t" style="min-height:140px"></textarea></label><p class="err"></p><button class="btn primary" data-action="evol-ok">Assinar e salvar</button></div>`)},
  'evol-ok'(){const t=val('ev-t');if(!t){erro('Escreva a evolução.');return}const e={id:uid(),area:minhasAreas()[0],texto:t,sig:assinar()};const p=toNum(val('ev-peso'));if(p)e.peso=p;curRes().evol.push(e);save();closeModal();render();toast('Evolução salva')},
  /* estoque */
  entrada(b){const r=b.dataset.r?res(b.dataset.r):null;const it=(r?r.estoque:S.casa).find(x=>x.id===b.dataset.id);
    openModal(head('Registrar entrada')+`<p><b>${esc(it.nome)}</b>${r?` de ${esc(r.nome)}`:''}, hoje com ${num(it.qtd)} ${esc(it.unid)}</p><div class="form"><label class="f">Quantidade recebida (${esc(it.unid)})<input type="text" id="en-q" inputmode="decimal"></label><label class="f">Quem trouxe ou origem<input type="text" id="en-o" placeholder="Ex.: filha, farmácia popular"></label><button class="btn primary" data-action="entrada-ok" data-r="${r?r.id:''}" data-id="${it.id}">Somar ao estoque</button></div>`)},
  'entrada-ok'(b){const q=toNum(val('en-q'));if(!(q>0)){toast('Informe a quantidade');return}const r=b.dataset.r?res(b.dataset.r):null;const it=(r?r.estoque:S.casa).find(x=>x.id===b.dataset.id);it.qtd+=q;
    (it.entradas=it.entradas||[]).push({q,orig:val('en-o'),sig:assinar()});save();closeModal();render();toast('Entrada registrada')},
  'item-edit'(b){const r=b.dataset.r?res(b.dataset.r):null;const it=b.dataset.id?(r?r.estoque:S.casa).find(x=>x.id===b.dataset.id):{nome:'',unid:'',qtd:0,min:0,consumoDia:0};
    openModal(head(b.dataset.id?'Editar item':'Novo item')+`<div class="form"><label class="f">Nome<input type="text" id="it-n" value="${esc(it.nome)}"></label><div class="fields" style="margin:0"><label class="f">Unidade<input type="text" id="it-u" value="${esc(it.unid)}" placeholder="comp, gotas, un"></label><label class="f">Quantidade<input type="text" id="it-q" value="${it.qtd}" inputmode="decimal"></label><label class="f">Mínimo<input type="text" id="it-m" value="${it.min}" inputmode="decimal"></label></div>
    ${r?'<p class="hint" style="margin:0">O consumo vem da prescrição médica.</p>':`<label class="f">Consumo por dia<input type="text" id="it-c" value="${it.consumoDia||0}" inputmode="decimal"></label>`}<button class="btn primary" data-action="item-ok" data-r="${r?r.id:''}" data-id="${b.dataset.id||''}">Salvar</button></div>`)},
  'item-ok'(b){if(!val('it-n')){toast('Informe o nome');return}const r=b.dataset.r?res(b.dataset.r):null;const arr=r?r.estoque:S.casa;
    const d={nome:val('it-n'),unid:val('it-u')||'un',qtd:toNum(val('it-q'))||0,min:toNum(val('it-m'))||0};if(!r)d.consumoDia=toNum(val('it-c'))||0;
    if(b.dataset.id)Object.assign(arr.find(x=>x.id===b.dataset.id),d);else arr.push({id:uid(),...d});save();closeModal();render();toast('Item salvo')},
  familia(b){const r=res(b.dataset.r);waModal(`Pedido para ${esc(r.responsavel?.nome||'a família')}`,textoFamilia(r),r.responsavel?.tel)},
  'lista-casa'(){const ls=S.casa.map(it=>({it,q:compra30(it.consumoDia,it)})).filter(x=>x.q>0);
    waModal('Lista do mês',`*Lista de compras: ${MESES[TODAY.getMonth()]} de ${TODAY.getFullYear()}*\n${S.inst}\n\n${ls.map(x=>`• ${x.it.nome}: ${x.q} ${x.it.unid}`).join('\n')||'Nada a comprar'}\n\nCalculado para 30 dias mais o estoque mínimo.`,'')},
  'est-seg'(b){estSeg=b.dataset.v;render()},
  /* temperatura */
  'temp-nova'(){const t=minAgora()<minDe('13:00')?'manha':'noite';openModal(head('Temperatura da geladeira')+`<div class="form"><label class="f">Turno<select id="tp-t"><option value="manha" ${t==='manha'?'selected':''}>Manhã</option><option value="noite" ${t==='noite'?'selected':''}>Noite</option></select></label>
    <div class="fields" style="grid-template-columns:repeat(2,minmax(0,1fr));margin:0"><label class="f">Máxima °C<input type="text" id="tp-max" inputmode="decimal"></label><label class="f">Mínima °C<input type="text" id="tp-min" inputmode="decimal"></label><label class="f">Momento °C<input type="text" id="tp-mom" inputmode="decimal"></label><label class="f">Ambiente °C<input type="text" id="tp-amb" inputmode="decimal"></label></div>
    <p class="err"></p><button class="btn primary" data-action="temp-ok">Assinar e registrar</button></div>`)},
  'temp-ok'(){const v=['max','min','mom','amb'].map(k=>toNum(val('tp-'+k)));if(v.slice(0,3).some(x=>x==null)){erro('Preencha máxima, mínima e momento.');return}
    const t=val('tp-t');S.temperaturas=S.temperaturas.filter(x=>!(x.d===T&&x.turno===t));S.temperaturas.push({id:uid(),d:T,turno:t,h:agoraHM(),max:v[0],min:v[1],mom:v[2],amb:v[3]??'',sig:assinar()});
    S.temperaturas.sort((a,b)=>(a.d+a.turno).localeCompare(b.d+b.turno));save();closeModal();render();toast(v.slice(0,3).some(x=>x<2||x>8)?'Fora da faixa. Registre a conduta e avise o RT.':'Temperatura registrada')},
  /* equipe */
  brush(b){brush=b.dataset.v;render()},
  'esc-cell'(b){const m=S.escalaMes[escMes]=S.escalaMes[escMes]||{};const a=m[b.dataset.s]=m[b.dataset.s]||[];const i=+b.dataset.i;a[i]=a[i]===brush?'':brush;save();
    b.className='code '+(a[i]?'c-'+a[i]:'');b.textContent=a[i]||''},
  'prof-edit'(b){const p=b.dataset.id?prof(b.dataset.id):{nome:'',cat:'tec',funcao:'',conselho:'',setor:'Diurno 12h',area:'',carga:'',horario:''};
    openModal(head(b.dataset.id?'Editar profissional':'Novo profissional')+`<div class="form"><label class="f">Nome<input type="text" id="pf-n" value="${esc(p.nome)}"></label>
    <label class="f">Categoria (define o acesso)<select id="pf-c">${Object.entries(CATS).map(([k,v])=>`<option value="${k}" ${p.cat===k?'selected':''}>${v}</option>`).join('')}</select></label>
    <label class="f">Função<input type="text" id="pf-f" value="${esc(p.funcao)}" placeholder="Ex.: Auxiliar de enfermagem"></label><label class="f">Conselho e número<input type="text" id="pf-co" value="${esc(p.conselho)}" placeholder="Ex.: COREN-SP 000.000-AE"></label>
    <label class="f">Setor na escala de enfermagem<select id="pf-s"><option value=""></option>${[...SETORES,'Cuidadores'].map(s=>`<option ${p.setor===s?'selected':''}>${s}</option>`).join('')}</select></label>
    <label class="f">Área de evolução<select id="pf-a"><option value=""></option>${AREAS.map(a=>`<option ${p.area===a?'selected':''}>${a}</option>`).join('')}</select></label>
    <div class="fields two" style="margin:0"><label class="f">Carga horária<input type="text" id="pf-ch" value="${esc(p.carga||'')}"></label><label class="f">Dias e horário<input type="text" id="pf-h" value="${esc(p.horario||'')}"></label></div>
    <button class="btn primary" data-action="prof-ok" data-id="${b.dataset.id||''}">Salvar</button></div>`)},
  'prof-ok'(b){if(!val('pf-n')){toast('Informe o nome');return}const d={nome:val('pf-n'),cat:val('pf-c'),funcao:val('pf-f')||CATS[val('pf-c')],conselho:val('pf-co'),setor:val('pf-s'),area:val('pf-a'),carga:val('pf-ch'),horario:val('pf-h')};
    if(b.dataset.id)Object.assign(prof(b.dataset.id),d);else S.equipe.push({id:uid(),...d});save();closeModal();render();toast('Profissional salvo')},
  'trein-novo'(){openModal(head('Registrar treinamento')+`<div class="form"><label class="f">Tema<input type="text" id="tr-t"></label><label class="f">Data<input type="date" id="tr-d" value="${T}"></label><span class="muted small">Presença</span>
    ${S.equipe.filter(p=>NURSE.includes(p.cat)||p.cat==='cuid').map(p=>`<label class="opt"><input type="checkbox" class="tr-p" value="${p.id}"><span>${esc(p.nome)}</span></label>`).join('')}<button class="btn primary" data-action="trein-ok">Salvar</button></div>`)},
  'trein-ok'(){if(!val('tr-t')){toast('Informe o tema');return}S.treinamentos.push({id:uid(),tema:val('tr-t'),data:val('tr-d')||T,presentes:[...md.querySelectorAll('.tr-p:checked')].map(c=>c.value)});save();closeModal();render();toast('Treinamento registrado')},
  /* gestão */
  'doc-renovar'(b){const d=S.documentos.find(x=>x.id===b.dataset.id);openModal(head('Renovar documento')+`<p><b>${esc(d.nome)}</b></p><div class="form"><label class="f">Nova validade<input type="date" id="dv" value="${d.validade}"></label><button class="btn primary" data-action="doc-ok" data-id="${d.id}">Salvar validade</button></div>`)},
  'doc-ok'(b){const v=val('dv');if(!v)return;S.documentos.find(x=>x.id===b.dataset.id).validade=v;save();closeModal();render();toast('Validade atualizada')},
  'doc-novo'(){openModal(head('Novo documento')+`<div class="form"><label class="f">Documento<input type="text" id="dn-n" placeholder="Ex.: AVCB"></label><label class="f">Órgão<input type="text" id="dn-o"></label><label class="f">Validade<input type="date" id="dn-v"></label><button class="btn primary" data-action="docn-ok">Salvar</button></div>`)},
  'docn-ok'(){if(!val('dn-n')||!val('dn-v')){toast('Informe nome e validade');return}S.documentos.push({id:uid(),nome:val('dn-n'),orgao:val('dn-o'),validade:val('dn-v')});save();closeModal();render()},
  'pop-rev'(b){S.pops.find(p=>p.id===b.dataset.id).revisao=T;save();render();toast('Revisão registrada')},
  'pop-novo'(){openModal(head('Adicionar documento técnico')+`<div class="form"><label class="f">Título<input type="text" id="pn-t"></label><label class="f">Tipo<select id="pn-tp">${TIPOS_DOC.map(t=>`<option>${t}</option>`).join('')}</select></label><label class="f">Última revisão<input type="date" id="pn-r" value="${T}"></label><button class="btn primary" data-action="popn-ok">Salvar</button></div>`)},
  'popn-ok'(){if(!val('pn-t'))return;S.pops.push({id:uid(),titulo:val('pn-t'),tipo:val('pn-tp'),revisao:val('pn-r')||T});save();closeModal();render()},
  'ind-copiar'(){const {den,rows}=calcInd(indMes);copiar(['Indicador\tCasos\tResidentes\tTaxa (%)',...rows.map(r=>`${r.n}\t${r.c}\t${den}\t${r.taxa.toFixed(2).replace('.',',')}`)].join('\n'))},
  'copiar-fugulin'(){copiar(['Residente\tSexo\tFugulin\tGrau',...ativos().map(r=>{const a=ultAval(r,'fugulin');return `${r.nome}\t${r.sexo||''}\t${a?totalEsc('fugulin',a.resp):''}\t${grau(r)||''}`})].join('\n'))},
  reset(){openModal(head('Restaurar dados de exemplo')+`<p>Tudo o que foi registrado neste aparelho será apagado.</p><button class="btn primary" data-action="reset-ok">Apagar e restaurar</button>`)},
  'reset-ok'(){S=seed();save();closeModal();selRes=null;view='plantao';render();toast('Dados restaurados')}
};
function lerArquivo(f){return new Promise((ok,no)=>{const fr=new FileReader();fr.onload=()=>ok(fr.result);fr.onerror=no;fr.readAsDataURL(f)})}
async function reduzirImg(f,max,q,quad){const url=await lerArquivo(f);const img=await new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=url});
  let sx=0,sy=0,sw=img.width,sh=img.height;if(quad){const m=Math.min(sw,sh);sx=(sw-m)/2;sy=(sh-m)/2;sw=sh=m}
  const k=Math.min(1,max/Math.max(sw,sh));const c=document.createElement('canvas');c.width=Math.round(sw*k);c.height=Math.round(sh*k);
  c.getContext('2d').drawImage(img,sx,sy,sw,sh,0,0,c.width,c.height);return c.toDataURL('image/jpeg',q)}
const C={
  async foto(el){const f=el.files&&el.files[0];if(!f)return;const r=curRes();const antes=r.foto;
    try{r.foto=await reduzirImg(f,360,.82,true)}catch(e){toast('Não foi possível ler a foto');return}
    if(!save()){r.foto=antes;toast('Sem espaço neste aparelho para a foto');return}render();toast('Foto salva na pasta')},
  user(el){S.user=el.value;save();selRes=null;resTab='pasta';if(!navVisivel().includes(view))view='plantao';render();toast(`Entrou como ${primeiro(prof(el.value).nome)}`)},
  rf(el){const r=curRes();let v=el.value;if(el.type==='number')v=toNum(v);setPath(r,el.dataset.f,v);save();render()},
  pia(el){const p=curRes().pia.find(x=>x.id===el.dataset.id);p[el.dataset.f]=el.value;save()},
  'aval-live'(el){const k=el.dataset.k;const its=SCALES[k].itens;let t=0,ok=true;its.forEach((_,i)=>{const c=md.querySelector(`input[name=q${i}]:checked`);if(c)t+=its[i][1][+c.value][1];else ok=false});
    const o=document.getElementById('av-tot');if(o)o.innerHTML=ok?`<b>${t} pontos</b> <span class="badge ${SCALES[k].classif(t).nivel}">${SCALES[k].classif(t).txt}</span>`:`<span class="muted">Parcial: ${t} pontos</span>`},
  'p-tipo'(el){const t=el.value;document.getElementById('w-h').hidden=t==='sn';document.getElementById('w-d').hidden=t!=='semanal';document.getElementById('w-i').hidden=t!=='intervalo'},
  'p-est'(el){document.getElementById('w-novo').hidden=el.value!=='novo'},
  escmes(el){escMes=el.value;render()},
  indmes(el){indMes=el.value;render()},
  inst(el){S.inst=el.value||'Residencial';save();render()}
};
document.addEventListener('click',e=>{
  const g=e.target.closest('[data-go]');if(g){go(g.dataset.go);return}
  const a=e.target.closest('[data-action]');if(a&&A[a.dataset.action]){if(a.tagName!=='A')e.preventDefault();A[a.dataset.action](a,e)}
});
document.addEventListener('change',e=>{const c=e.target.closest('[data-change]');if(c&&C[c.dataset.change])C[c.dataset.change](c)});

view=NAMES[location.hash.slice(1)]?location.hash.slice(1):'plantao';
render();
setInterval(()=>{if(!ov.classList.contains('open')&&view==='plantao'&&!document.activeElement.matches('input,select,textarea'))render()},60000);
</script>
